<style>
/* Layout: scena 3D a tutto schermo, card controlli flottante in basso a destra (in basso a tutta larghezza su mobile).
   Token allineati al file Figma "[NEW UI] Canelè – Configurator": Colori · Giorno / Sera, Dimensioni · Base / Desktop / Mobile. */
:root {
  /* Colori · Giorno */
  --bg: #D9D1C5;
  --panel: rgba(250, 247, 242, 0.8);
  --line: rgba(52, 44, 34, 0.14);
  --fg: #2A251F;
  --fg-inverse: #ECE4D6;
  --muted: #4F463A;
  --accent: #766D62;
  --accent-soft: rgba(118, 109, 98, 0.10);
  --chip-ring: rgba(42, 37, 31, 0.14);
  --switch-off: rgba(42, 37, 31, 0.08);
  --glow: rgba(118, 109, 98, 0.55);
  /* Tipografia: Cormorant Garamond (elegante) + Manrope (leggibile, sempre al 7%) */
  --font-display: "Cormorant Garamond", "Cormorant", Garamond, "Times New Roman", serif;
  --font-body: "Manrope", "Helvetica Neue", Arial, sans-serif;
  --track: 0.07em;
  /* Dimensioni · Base */
  --chip-size: 30px; --chip-padding: 3px; --chips-gap: 8px;
  --tab-padding-x: 12px; --tab-padding-y: 10px; --tab-gap: 2px; --tabs-gap: 6px;
  --group-gap: 8px; --groups-gap: 14px; --content-gap: 16px; --divider-padding-top: 14px;
  --switch-width: 58px; --switch-height: 32px; --switch-knob: 24px; --switch-padding: 3px;
  --mode-padding: 3px; --mode-gap: 2px; --mode-icon: 15px; --mode-button-gap: 6px;
  --cta-height: 42px; --cta-padding: 12px; --cta-gap: 8px; --cta-inner-gap: 4px;
  /* Dimensioni · Desktop */
  --page-gutter: 24px; --header-padding-y: 20px;
  --panel-padding: 24px; --panel-gap: 24px; --panel-width: 330px; --panel-offset-bottom: 24px;
  --mode-button-padding-x: 12px; --mode-button-padding-y: 6px;
  --radius-panel: 40px; --radius-tab: 16px;
  --logo-size: 32px; --brand-gap: 16px;
  /* Stili di testo · Desktop */
  --brand-size: 32px; --selector-size: 15px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101814; --panel: rgba(16, 22, 19, 0.8); --line: rgba(236, 228, 214, 0.12);
    --fg: #ECE4D6; --fg-inverse: #2A251F; --muted: #B0A491; --accent: #9A9286; --accent-soft: rgba(154, 146, 134, 0.08);
    --chip-ring: rgba(255, 255, 255, 0.16); --switch-off: rgba(236, 228, 214, 0.08); --glow: rgba(154, 146, 134, 0.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101814; --panel: rgba(16, 22, 19, 0.8); --line: rgba(236, 228, 214, 0.12);
  --fg: #ECE4D6; --fg-inverse: #2A251F; --muted: #B0A491; --accent: #9A9286; --accent-soft: rgba(154, 146, 134, 0.08);
  --chip-ring: rgba(255, 255, 255, 0.16); --switch-off: rgba(236, 228, 214, 0.08); --glow: rgba(154, 146, 134, 0.8);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); overflow: hidden; }
.app { position: relative; height: 100%; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#scene:active { cursor: grabbing; }

/* ---------- Header ---------- */
.top {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding-block: var(--header-padding-y);
  padding-left: max(var(--page-gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--page-gutter), env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.brand { display: flex; align-items: center; gap: var(--brand-gap); color: var(--fg); min-width: 0; }
.brand svg { width: auto; height: var(--logo-size); flex: none; fill: currentColor; }
.brand-text { font: 500 var(--brand-size)/1 var(--font-display); letter-spacing: 0; white-space: nowrap; }
.brand-div { font: 500 var(--brand-size)/1 var(--font-display); }
.mode {
  pointer-events: auto; display: inline-flex; gap: var(--mode-gap); padding: var(--mode-padding); flex: none;
  border: 1px solid var(--line); border-radius: 999px; background: var(--panel);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.mode button {
  appearance: none; border: 0; background: transparent; color: var(--muted); cursor: pointer;
  display: inline-flex; align-items: center; gap: var(--mode-button-gap);
  padding: var(--mode-button-padding-y) var(--mode-button-padding-x); border-radius: 999px;
  font: 400 var(--selector-size)/1.2 var(--font-display); transition: background .25s, color .25s;
}
.mode button svg { width: var(--mode-icon); height: var(--mode-icon); flex: none; }
.mode button[aria-pressed="true"] { background: var(--accent-soft); color: var(--fg); box-shadow: inset 0 0 0 1px var(--accent); }
.mode button:hover { color: var(--fg); }
body, .panel, .tab, .mode, .loader { transition-property: background-color, color, border-color; transition-duration: .8s; }

/* ---------- Card controlli ---------- */
.panel {
  position: absolute;
  right: max(var(--page-gutter), env(safe-area-inset-right, 0px));
  bottom: calc(var(--panel-offset-bottom) + env(safe-area-inset-bottom, 0px));
  width: var(--panel-width);
  max-width: calc(100% - 2 * var(--page-gutter));
  max-height: calc(100% - 110px); overflow-y: auto; scrollbar-width: none;
  background: var(--panel);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  border-radius: var(--radius-panel);
  padding: var(--panel-padding);
  display: flex; flex-direction: column; gap: var(--panel-gap);
}
.panel::-webkit-scrollbar { display: none; }
.content { display: flex; flex-direction: column; gap: var(--content-gap); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: var(--tabs-gap); }
.tab {
  appearance: none; border: 1px solid var(--line); background: transparent; color: var(--fg);
  border-radius: var(--radius-tab); padding: var(--tab-padding-y) var(--tab-padding-x); text-align: left; cursor: pointer;
  font: 500 18px/1.2 var(--font-display); letter-spacing: -0.01em;
  display: flex; flex-direction: column; gap: var(--tab-gap);
  transition: color .2s, border-color .2s, background .2s;
}
.tab small { font: 400 12px/1.3 var(--font-body); letter-spacing: var(--track); color: var(--muted); }
.tab[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); }
.tab:hover { border-color: var(--accent); }

.options { display: flex; flex-direction: column; gap: var(--groups-gap); }
.opt-group { display: flex; flex-direction: column; gap: var(--group-gap); }
.opt-group h3 { margin: 0; font: 600 12px/1.3 var(--font-body); letter-spacing: var(--track); text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: var(--chips-gap); }
.cchip {
  appearance: none; cursor: pointer; padding: var(--chip-padding); border-radius: 50%;
  border: 1px solid transparent; background: transparent; transition: border-color .2s;
}
.cchip span { display: block; width: var(--chip-size); height: var(--chip-size); border-radius: 50%; border: 1px solid var(--chip-ring); box-shadow: inset 0 -5px 8px rgba(0,0,0,0.18); }
.cchip:hover { border-color: var(--line); }
.cchip[aria-pressed="true"] { border-color: var(--accent); }

.light-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-top: 1px solid var(--line); padding-top: var(--divider-padding-top); }
.light-row .lbl { display: flex; flex-direction: column; gap: 2px; }
.light-row .lbl strong { font: 500 18px/1.2 var(--font-display); color: var(--fg); }
.light-row .lbl small { font: 400 11px/1.3 var(--font-body); letter-spacing: var(--track); text-transform: uppercase; color: var(--muted); }
.switch {
  appearance: none; cursor: pointer; position: relative; flex: none;
  width: var(--switch-width); height: var(--switch-height); border-radius: 999px; border: 1px solid var(--line);
  background: var(--switch-off); transition: background .25s, border-color .25s;
}
.switch::after {
  content: ""; position: absolute; top: 50%; left: calc(var(--switch-padding) - 1px); transform: translateY(-50%);
  width: var(--switch-knob); height: var(--switch-knob); border-radius: 50%;
  background: var(--muted); transition: transform .25s ease, background .25s, box-shadow .25s;
}
.switch[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.switch[aria-pressed="true"]::after { transform: translate(calc(var(--switch-width) - var(--switch-knob) - 2 * var(--switch-padding)), -50%); background: var(--accent); box-shadow: 0 0 14px var(--glow); }

/* Riepilogo: chiavi in Cormorant SemiBold maiuscolo, valori in Manrope SemiBold */
.summary { line-height: 1.6; color: var(--muted); }
.summary .k { font: 600 13px/1.6 var(--font-display); text-transform: uppercase; }
.summary b { font: 600 12px/1.6 var(--font-body); letter-spacing: var(--track); color: var(--fg); }

/* CTA */
.ctas { display: flex; gap: var(--cta-gap); }
.cta {
  appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: var(--cta-inner-gap);
  height: var(--cta-height); padding: 0 var(--cta-padding); border-radius: 999px; white-space: nowrap;
  text-decoration: none; cursor: pointer; transition: background .25s, color .25s, border-color .25s, opacity .2s;
  font: 400 var(--selector-size)/1 var(--font-display);
}
.cta-secondary { flex: 1 1 auto; min-width: 0; border: 1px solid var(--line); color: var(--fg); background: transparent; }
.cta-secondary:hover { border-color: var(--accent); }
.cta-primary { flex: 0 0 auto; border: 1px solid var(--fg); background: var(--fg); color: var(--fg-inverse); }
.cta-primary:hover { opacity: .9; }
.cta-price { font: 600 12px/1 var(--font-body); letter-spacing: var(--track); }

/* Loader: la "a" del logo si scrive, poi compaiono modello e interfaccia */
.loader {
  position: absolute; inset: 0; z-index: 20; background: var(--bg);
  display: grid; place-items: center; align-content: center; gap: 18px;
  transition: opacity .7s ease, visibility 0s linear .7s;
}
.loader svg { width: min(120px, 28vw); height: auto; overflow: visible; }
.loader .ink { fill: var(--fg); }
.loader .trace { fill: none; stroke: #fff; stroke-width: 48; stroke-linecap: round; stroke-linejoin: round; }
.loader .status { font: 500 22px/1 var(--font-display); color: var(--muted); }
.loader.done { opacity: 0; visibility: hidden; }
.top, .panel, .hint { opacity: 0; transform: translateY(8px); transition: opacity .8s ease .5s, transform .8s ease .5s; }
#scene { opacity: 0; transition: opacity 1.4s ease; }
.app.ready #scene { opacity: 1; }
.app.ready .top, .app.ready .panel, .app.ready .hint { opacity: 1; transform: none; }

.hint {
  position: absolute; bottom: calc(var(--panel-offset-bottom) + env(safe-area-inset-bottom, 0px)); left: max(var(--page-gutter), env(safe-area-inset-left, 0px));
  font: 500 13px/1.3 var(--font-body); letter-spacing: var(--track); color: var(--muted);
  pointer-events: none;
}
.fallback { position: absolute; inset: 0; z-index: 30; background: var(--bg); display: grid; place-items: center; align-content: center; gap: 14px; padding: 24px; text-align: center; color: var(--muted); font: 400 15px/1.5 var(--font-body); letter-spacing: var(--track); }
.reload { appearance: none; cursor: pointer; border: 1px solid var(--fg); background: var(--fg); color: var(--fg-inverse); border-radius: 999px; height: var(--cta-height); padding: 0 18px; font: 400 15px var(--font-display); }

button:focus-visible, .cta:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Mobile ---------- */
@media (max-width: 640px) {
  :root {
    --page-gutter: 16px; --header-padding-y: 14px;
    --panel-padding: 24px; --panel-gap: 16px; --panel-offset-bottom: 16px;
    --mode-button-padding-x: 10px; --mode-button-padding-y: 6px;
    --radius-panel: 24px; --radius-tab: 8px;
    --logo-size: 24px; --brand-gap: 8px;
    --brand-size: 22px; --selector-size: 14px;
  }
  .panel {
    left: max(var(--page-gutter), env(safe-area-inset-left, 0px));
    right: max(var(--page-gutter), env(safe-area-inset-right, 0px));
    width: auto; max-width: none; max-height: calc(100% - 90px);
  }
  .ctas { flex-direction: column; }
  .cta-secondary, .cta-primary { flex: none; width: 100%; }
  .summary, .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  #scene, .top, .panel, .hint, .loader, .tab, .switch, .switch::after, .cta { transition: none; }
}
</style>
</head>

          "             mix(mix(h3(i+vec3(0,0,1)), h3(i+vec3(1,0,1)), f.x), mix(h3(i+vec3(0,1,1)), h3(i+vec3(1,1,1)), f.x), f.y), f.z); }",

      })
      .then(buildLamp)
      .catch(function () { showFallback("Il modello 3D non si è caricato. Ricarica la pagina."); });
  }
  loadModel();

  // ---------- Loop ----------
  var clock = new THREE.Clock();
  var tmp = new THREE.Color(), WHITE = new THREE.Color(1, 1, 1);
  function settled() {
    return Math.abs(cur.theme - target.theme) < 0.002 && Math.abs(cur.light - target.light) < 0.002 && Math.abs(cur.fuzz - target.fuzz) < 0.002 &&
      Math.abs(cur.speck - target.speck) < 0.002 && Math.abs(cur.varia - target.varia) < 0.002 &&
      Math.abs(cur.inner.r - target.inner.r) + Math.abs(cur.inner.g - target.inner.g) + Math.abs(cur.inner.b - target.inner.b) < 0.002 &&
      Math.abs(cur.cable.r - target.cable.r) + Math.abs(cur.cable.g - target.cable.g) + Math.abs(cur.cable.b - target.cable.b) < 0.002;
  }
  var failed = false;
  // Se la scheda video interrompe il 3D, si prova a ripartire da soli; altrimenti si offre un pulsante.
  canvas.addEventListener("webglcontextlost", function (e) {
    e.preventDefault(); failed = true;
    var t = setTimeout(function () {
      showFallback("La scheda video ha interrotto il 3D.");
      var b = document.createElement("button");
      b.type = "button"; b.className = "reload"; b.textContent = "Ricarica il configuratore";
      b.addEventListener("click", function () { location.reload(); });
      var fb = document.querySelector(".fallback"); if (fb) { fb.style.alignContent = "center"; fb.appendChild(b); }
    }, 2500);
    canvas.addEventListener("webglcontextrestored", function () { clearTimeout(t); location.reload(); }, { once: true });
  });
  // Quando la pagina viene chiusa o sostituita da una nuova versione, il contesto 3D viene liberato subito
  // invece di restare a occupare la scheda video.
  window.addEventListener("pagehide", function () {
    try { renderer.dispose(); renderer.forceContextLoss(); } catch (e) {}
  });
  function frame() {
    if (failed) return;
    requestAnimationFrame(frame);
    var dt = Math.min(clock.getDelta(), 0.05);
    var changing = !settled(); // valutato prima delle transizioni: anche l'ultimo passo va disegnato
    var k = reduceMotion ? 1 : 1 - Math.exp(-dt * 6);
    var kl = reduceMotion ? 1 : 1 - Math.exp(-dt * 4.5);
    cur.inner.lerp(target.inner, k);
    cur.speck += (target.speck - cur.speck) * k;
    cur.varia += (target.varia - cur.varia) * k;
    cur.cable.lerp(target.cable, k);
    cur.fuzz += (target.fuzz - cur.fuzz) * k;
    cur.light += (target.light - cur.light) * kl;
    cur.theme += (target.theme - cur.theme) * (reduceMotion ? 1 : 1 - Math.exp(-dt * 3.5));
    var L = cur.light;

    innerMat.color.copy(cur.inner);
    innerMat.userData.u.uSpeck.value = cur.speck;
    innerMat.userData.u.uVaria.value = cur.varia;
    cableMat.color.copy(cur.cable);
    fuzzMat.color.copy(cur.cable).lerp(WHITE, 0.12).multiplyScalar(0.62 - 0.3 * L);
    fuzzMat.opacity = 0.38 * cur.fuzz;
    fuzzMat.visible = cur.fuzz > 0.01;

    tmp.copy(WARM).lerp(cur.inner, 0.2);
    bulbLight.color.copy(tmp); spill.color.copy(tmp); scatterMid.color.copy(tmp); scatterTop.color.copy(tmp);
    bulbMat.emissiveIntensity = 3 * L;
    bulbLight.intensity = 3.2 * L * (1 - 0.3 * cur.theme); // di giorno la raggiera non brucia
    scatterMid.intensity = 4.0 * L;
    scatterTop.intensity = 2.0 * L;
    spill.intensity = 0.35 * L;
    var D = cur.theme; // 0 = Sera, 1 = Giorno
    hemi.color.copy(HEMI_SKY_N).lerp(HEMI_SKY_D, D);
    hemi.groundColor.copy(HEMI_GND_N).lerp(HEMI_GND_D, D);
    key.color.copy(KEY_N).lerp(KEY_D, D);
    hemi.intensity = (0.6 - 0.48 * L) * (1 - D) + (0.7 - 0.12 * L) * D;
    key.intensity = (1.0 - 0.85 * L) * (1 - D) + (1.05 - 0.2 * L) * D;
    floorMat.color.copy(FLOOR_NIGHT).lerp(FLOOR_DAY, D);
    contact.material.opacity = (1 - 0.6 * L) * (1 - 0.45 * D);
    var envI = (1 - 0.75 * L) * (1 - D) + (0.85 - 0.15 * L) * D;
    shadeMat.envMapIntensity = innerMat.envMapIntensity = bodyMat.envMapIntensity = cableMat.envMapIntensity = envI;
    scene.background.copy(BG_OFF).lerp(BG_ON, L);
    tmpBg.copy(BG_DAY_OFF).lerp(BG_DAY_ON, L);
    scene.background.lerp(tmpBg, D);

    if (intro) {
      intro.t = Math.min(1, intro.t + dt / intro.dur);
      var ei = easeOut(intro.t), sp = new THREE.Spherical(
        intro.start.radius + (intro.end.radius - intro.start.radius) * ei,
        intro.start.phi + (intro.end.phi - intro.start.phi) * ei,
        intro.start.theta + (intro.end.theta - intro.start.theta) * ei);
      camera.position.setFromSpherical(sp).add(intro.tgt);
      camera.lookAt(intro.tgt);
      if (intro.t >= 1) { intro = null; controls.enabled = true; }
    }
    if (tween) {
      tween.t += dt / tween.dur;
      var e = ease(Math.min(tween.t, 1));
      camera.position.lerpVectors(tween.fromP, tween.toP, e);
      controls.target.lerpVectors(tween.fromT, tween.toT, e);
      if (tween.t >= 1) tween = null;
    }
    var moved = controls.update();
    // si disegna solo quando qualcosa cambia: camera, transizioni, caricamento
    if (moved || tween || intro || changing || dirty > 0) {
      try { renderer.render(scene, camera); }
      catch (err) { failed = true; showFallback("Il 3D si è interrotto: " + (err && err.message ? err.message : err) + ". Ricarica la pagina."); }
    }
    if (dirty > 0) dirty--;
  }
  frame();
})();
</script>
</body>
</html>
